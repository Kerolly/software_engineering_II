name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hardening rules for this file:
# - Every action is pinned to a full commit SHA, with its version in a comment.
#   Update the SHA and the comment together.
# - Every job has timeout-minutes, so a hung job stops early instead of after
#   GitHub's 6-hour default.
# - actions/checkout does not keep the token for later steps
#   (persist-credentials: false).

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: se2
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: se2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U se2 -d se2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/se2
      SPRING_DATASOURCE_USERNAME: se2
      SPRING_DATASOURCE_PASSWORD: ci-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Pull request title and branch name must follow CONTRIBUTING.md.
  conventions:
    name: Conventions
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title and branch name
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
        run: |
          status=0
          if ! echo "$PR_TITLE" | grep -Eq '^SCRUM-[0-9]+ .+'; then
            echo "::error::PR title must be 'SCRUM-<nr> Description', got: $PR_TITLE"
            status=1
          fi
          if ! echo "$BRANCH" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/SCRUM-[0-9]+-[a-z0-9-]+$'; then
            echo "::error::Branch must be 'type/SCRUM-<nr>-short-description' (lowercase, hyphens), got: $BRANCH"
            status=1
          fi
          exit $status

  # One stable name to mark as the required check in the branch protection rule.
  ci:
    name: CI
    if: always()
    needs: [backend, frontend, conventions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
